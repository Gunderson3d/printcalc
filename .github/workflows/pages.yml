name: Pages

# Builds printcalc-wasm, generates the wasm-bindgen glue into the demo
# folder, and publishes `printcalc-wasm/demo/` as the GitHub Pages site.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # The CLI must match the `wasm-bindgen` crate version in Cargo.lock,
      # or the generated glue refuses to load. Read it from the lock file
      # rather than pinning it twice.
      - name: Install wasm-bindgen-cli matching Cargo.lock
        run: |
          version=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          echo "wasm-bindgen $version"
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build wasm
        run: cargo build -p printcalc-wasm --target wasm32-unknown-unknown --release

      - name: Generate JS glue
        run: |
          wasm-bindgen target/wasm32-unknown-unknown/release/printcalc_wasm.wasm \
            --out-dir printcalc-wasm/demo/pkg --target web --no-typescript

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r printcalc-wasm/demo/. site/
          # Example files the demo can open via ?load=, so the live site
          # has something to try without a slicer to hand.
          mkdir -p site/examples
          cp "Testfiles/Cube_0.2mm_PLA_Prusa MINI_20m7s.gcode" site/examples/cube.gcode
          cp Testfiles/multi_plate_multicolor.gcode.3mf site/examples/multi-plate-multicolor.gcode.3mf
          cp Testfiles/Shape-Box.sl1s site/examples/shape-box.sl1s
          touch site/.nojekyll

      # Cloudflare Web Analytics (cookieless page views). The beacon is
      # added only to the published page, never to the source in
      # printcalc-wasm/demo/, so local builds send nothing. The site token
      # is public (it ships in the page); the repository variable
      # CF_WEB_ANALYTICS_TOKEN overrides it, and forks get no default.
      - name: Add Cloudflare Web Analytics
        env:
          CF_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN || (github.repository == 'gunderson3d/printcalc' && '283a2b2ed2aa4c368463c7fd6f04161f' || '') }}
        run: |
          if [ -z "$CF_TOKEN" ]; then echo "no analytics token; skipping"; exit 0; fi
          case "$CF_TOKEN" in
            *[!0-9a-fA-F]*) echo "CF_WEB_ANALYTICS_TOKEN must be hex" >&2; exit 1 ;;
          esac
          beacon="<!-- Cloudflare Web Analytics --><script type=\"module\" src=\"https://static.cloudflareinsights.com/beacon.min.js\" data-cf-beacon='{\"token\": \"$CF_TOKEN\"}'></script><!-- End Cloudflare Web Analytics -->"
          awk -v b="$beacon" '/<\/body>/ && !done { print b; done = 1 } { print }' \
            site/index.html > site/index.html.tmp
          mv site/index.html.tmp site/index.html
          grep -q cloudflareinsights site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
