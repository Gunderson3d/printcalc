[package]
name = "printcalc-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["bambu", "prusa"]

# Vendor umbrella features, passed through to printcalc.
bambu = ["printcalc/bambu"]
prusa = ["printcalc/prusa"]

# Individual format features, also passed through, for finer-grained builds.
bambu-3mf = ["printcalc/bambu-3mf"]
gcode = ["printcalc/gcode"]
prusa-sl1 = ["printcalc/prusa-sl1"]
prusa-bgcode = ["printcalc/prusa-bgcode"]

[dependencies]
printcalc = { path = "../printcalc", default-features = false }
serde_json = "1.0.151"
wasm-bindgen = "0.2"
