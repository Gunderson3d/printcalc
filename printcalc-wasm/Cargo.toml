[package]
name = "printcalc-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["bambu", "prusa"]

# Vendor umbrella features, passed through to libprintcalc.
bambu = ["libprintcalc/bambu"]
prusa = ["libprintcalc/prusa"]

# Individual format features, also passed through, for finer-grained builds.
bambu-3mf = ["libprintcalc/bambu-3mf"]
gcode = ["libprintcalc/gcode"]
prusa-sl1 = ["libprintcalc/prusa-sl1"]
prusa-bgcode = ["libprintcalc/prusa-bgcode"]

[dependencies]
libprintcalc = { path = "../libprintcalc", default-features = false }
serde_json = "1.0.151"
wasm-bindgen = "0.2"
