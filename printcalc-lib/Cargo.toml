[package]
name = "printcalc-lib"
version = "0.1.0"
edition = "2024"
description = "Calculate 3D print job costs (material, print time, printer wear, electricity, labor, hardware) from sliced-file output. See SPEC.md."
crate-type = ["cdylib","rlib"]
[features]
default = ["bambu", "prusa"]

# Vendor umbrella features: enable every format that vendor's slicer(s) produce.
bambu = ["bambu-3mf"]
prusa = ["prusa-gcode", "prusa-sl1", "prusa-bgcode"]

# Individual format features (selectable on their own for finer-grained builds).
bambu-3mf = []
prusa-gcode = []
prusa-sl1 = []
prusa-bgcode = []

[dependencies]
binarygcode = "0.0.3"
dirs = "6.0.0"
gcode = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
toml = "0.9"

xml = "1.3.0"
zip = "8.6.0"
