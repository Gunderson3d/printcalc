[package]
name = "printcalc-lib"
version = "0.2.0"
edition = "2024"
description = "Calculate 3D print job costs (material, print time, printer wear, electricity, labor, hardware) from sliced-file output. See SPEC.md."
readme = "README.md"
crate-type = ["cdylib","rlib"]
[features]
default = ["bambu", "prusa"]

# Vendor umbrella features: enable every format that vendor's slicer(s) produce and there are built-in presets.
bambu = ["bambu-3mf"]
prusa = ["prusa-gcode", "prusa-sl1", "prusa-bgcode"]

# Individual format features (selectable on their own for finer-grained builds).
bambu-3mf = ["dep:zip", "dep:xml"]
prusa-gcode = []
prusa-sl1 = ["dep:zip"]
prusa-bgcode = ["dep:binarygcode"]

[dependencies]
binarygcode = { version = "0.0.3", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.3"

xml = { version = "1.3.0", optional = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
