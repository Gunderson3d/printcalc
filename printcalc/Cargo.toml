[package]
name = "printcalc"
version = "0.2.0"
edition = "2024"
description = "Calculate 3D print job costs (material, print time, printer wear, electricity, labor, hardware) from sliced-file output. Library and CLI."
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/Kaifungamedev/printcalc"
homepage = "https://github.com/Kaifungamedev/printcalc"
keywords = ["3d-printing", "gcode", "3mf", "cost", "slicer"]
categories = ["command-line-utilities", "parser-implementations"]

[lib]
name = "printcalc"
path = "src/lib.rs"

[[bin]]
name = "printcalc"
path = "src/bin/printcalc/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "bambu", "prusa"]

# Build the `printcalc` binary. Enabled by default so `cargo install
# printcalc` works; library-only users can turn it off with
# `default-features = false` and `features = ["lib"]`.
cli = ["dep:clap", "dep:dirs"]
lib = ["bambu", "prusa"]

# Vendor umbrella features: enable every format that vendor's slicer(s) produce and there are built-in presets.
bambu = ["bambu-3mf"]
prusa = ["gcode", "prusa-sl1", "prusa-bgcode"]

# Individual format features (selectable on their own for finer-grained builds).
bambu-3mf = ["dep:tinyzip", "dep:miniz_oxide", "dep:xml"]
gcode = []
prusa-sl1 = ["dep:tinyzip", "dep:miniz_oxide"]
prusa-bgcode = ["dep:binarygcode"]

[dependencies]
binarygcode = { version = "0.0.3", optional = true }
clap = { version = "4.6.4", features = ["derive"], optional = true }
dirs = { version = "6.0.0", optional = true }
miniz_oxide = { version = "0.8.9", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
tinyzip = { version = "0.4.0", default-features = false, optional = true }
toml = "1.1.3"
xml = { version = "1.3.0", optional = true }

# Prebuilt binaries for `cargo binstall printcalc`, attached to the GitHub
# Release of each `v*` tag by .github/workflows/release.yml.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
