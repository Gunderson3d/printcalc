[package]
name = "printcalc"
version = "0.2.0"
edition = "2024"
description = "Command-line tool for calculating 3D print job costs (material, print time, printer wear, electricity, labor, hardware) from sliced-file output. The library lives in `libprintcalc`."
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/Kaifungamedev/printcalc"
homepage = "https://github.com/Kaifungamedev/printcalc"
keywords = ["3d-printing", "gcode", "3mf", "cost", "slicer"]
categories = ["command-line-utilities"]

[[bin]]
name = "printcalc"
path = "src/main.rs"

[features]
default = ["bambu", "prusa"]

# Vendor umbrella features, passed through to libprintcalc: enable every
# format that vendor's slicer(s) produce and there are built-in presets.
bambu = ["libprintcalc/bambu"]
prusa = ["libprintcalc/prusa"]

# Individual format features (selectable on their own for finer-grained builds).
bambu-3mf = ["libprintcalc/bambu-3mf"]
gcode = ["libprintcalc/gcode"]
prusa-sl1 = ["libprintcalc/prusa-sl1"]
prusa-bgcode = ["libprintcalc/prusa-bgcode"]

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
dirs = "6.0.0"
libprintcalc = { path = "../libprintcalc", version = "0.2.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.3"

# Prebuilt binaries for `cargo binstall printcalc`, attached to the GitHub
# Release of each `v*` tag by .github/workflows/release.yml.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
