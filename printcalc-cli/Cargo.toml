[package]
name = "printcalc-cli"
version = "0.1.0"
edition = "2024"


[[bin]]
name = "printcalc"
path = "src/main.rs"

[features]
default = ["bambu", "prusa"]

# Vendor umbrella features, passed through to printcalc-lib.
bambu = ["printcalc-lib/bambu"]
prusa = ["printcalc-lib/prusa"]

# Individual format features, also passed through, for finer-grained builds.
bambu-3mf = ["printcalc-lib/bambu-3mf"]
prusa-gcode = ["printcalc-lib/prusa-gcode"]
prusa-sl1 = ["printcalc-lib/prusa-sl1"]
prusa-bgcode = ["printcalc-lib/prusa-bgcode"]

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
dirs = "6.0.0"
printcalc-lib = { path = "../printcalc-lib", default-features = false }
serde = "1.0.229"
serde_json = "1.0.151"
toml = "1.1.3"
